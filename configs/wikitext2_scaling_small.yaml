# small model for the controlled WikiText-2 scaling pilot.

project:
  name: wikitext2-scaling-small
  stage: scaling-law-pilot

seed: 42
device: auto

data:
  train_path: data/raw/wikitext-2-raw-v1/train.txt
  validation_path: data/raw/wikitext-2-raw-v1/validation.txt
  test_path: data/raw/wikitext-2-raw-v1/test.txt
  tokenizer: character
  context_length: 128

model:
  vocab_size: 2048
  context_length: 128
  d_model: 64
  n_heads: 2
  n_layers: 2
  d_ff: 256
  dropout: 0.0
  position_encoding: learned

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 10000
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 100
  grad_clip_norm: 1.0
  eval_interval: 1000
  checkpoint_interval: 10000
  num_workers: 0
  mixed_precision: false
  output_dir: checkpoints/wikitext2-scaling-small
  metrics_path: runs/wikitext2-scaling-small/metrics.jsonl

evaluation:
  eval_batches: 20
  max_new_tokens: 100
  temperature: 0.8
  top_k: 50
